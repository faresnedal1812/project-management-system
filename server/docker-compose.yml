# ============================================================
# Project Management System — Docker Compose
# ============================================================
# Usage:
#   docker-compose up --build        → Build and start all services
#   docker-compose down              → Stop all services
#   docker-compose down -v           → Stop and delete volumes (clean slate)
#   docker-compose exec app npx prisma migrate deploy  → Apply migrations
# ============================================================

services:
  # ── Application Server ──────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: project-management-system-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - project-management-system-network

  # ── PostgreSQL Database ─────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: project-management-system-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U postgres -d project-management-system-db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - project-management-system-network

  # ── Redis (BullMQ Queue) ────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: project-management-system-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - project-management-system-network

# ── Persistent Volumes ─────────────────────────────────────────
volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local

# ── Internal Network ───────────────────────────────────────────
networks:
  project-management-system-network:
    driver: bridge
