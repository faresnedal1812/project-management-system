# ============================================================
# Render Blueprint — Infrastructure as Code
# ============================================================
# This file lets Render recreate your entire production
# infrastructure in one click from the Dashboard.
#
# Usage:
#   1. Push this file to your GitHub repository
#   2. Go to Render Dashboard → New → Blueprint
#   3. Select your repo → Render reads this file and provisions everything
#
# Docs: https://docs.render.com/infrastructure-as-code
# ============================================================

services:
  # ── Web Service (Express + Socket.IO + BullMQ Worker) ──────
  - type: web
    name: project-management-system-api
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./server/Dockerfile # not => ./Dockerfile (Render resolves these paths from the repository root.)
    dockerContext: ./server # not => .
    healthCheckPath: /api/v1/health
    envVars:
      # Application
      - key: NODE_ENV
        value: production

      # Database — linked from the managed PostgreSQL below
      - key: DATABASE_URL
        fromDatabase:
          name: project-management-system-db
          property: connectionString

      # # Redis — linked from the managed Redis below
      # - key: REDIS_HOST
      #   fromRedis:
      #     name: project-management-system-redis
      #     property: host
      # - key: REDIS_PORT
      #   fromRedis:
      #     name: project-management-system-redis
      #     property: port
      # - key: REDIS_PASSWORD
      #   fromRedis:
      #     name: project-management-system-redis
      #     property: password

      - key: REDIS_URL
        sync: false

      # JWT Secrets (set manually in Render Dashboard)
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 7d

      # CORS & Client URL (update after frontend deployment)
      - key: CORS_ORIGIN
        value: "*"
      - key: CLIENT_URL
        sync: false
      - key: API_URL
        sync: false

      # Rate Limiting
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "100"

      # Cloudinary (set manually in Render Dashboard → Environment tab)
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # SMTP (set manually in Render Dashboard → Environment tab)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false

databases:
  # ── Managed PostgreSQL ─────────────────────────────────────
  - name: project-management-system-db
    plan: free
    region: frankfurt
    databaseName: project_management_system_db
    user: pms_user

